# npm package `wherdr` (npx / bunx / pnpm dlx wherdr) published for each version tag
# (vX.Y.Z), through npm Trusted Publishing (OIDC): no NPM_TOKEN secret. On npmjs.com,
# the package's Trusted Publisher must name this repository and this file: npm.yml.
name: npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - name: Versions match the tag
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a version tag: $ref"; exit 1
          fi
          pkg=$(node -p "require('./package.json').version")
          plugin=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml)
          if [ "v$pkg" != "$ref" ]; then echo "::error::package.json version ($pkg) does not match tag $ref"; exit 1; fi
          if [ "v$plugin" != "$ref" ]; then echo "::error::herdr-plugin.toml version ($plugin) does not match tag $ref"; exit 1; fi

      - run: npm ci

      # prepack builds the app (nuxt build) and copies Nitro's linked packages.
      - name: Publish
        run: npm publish --provenance --access public
