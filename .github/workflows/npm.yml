# npm package `wherdr` (npx / bunx / pnpm dlx wherdr) published for each version tag
# (vX.Y.Z), through npm Trusted Publishing (OIDC): no NPM_TOKEN secret. On npmjs.com,
# the package's Trusted Publisher must name this repository and this file: npm.yml.
name: npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag (e.g. v1.3.3)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}
  GH_REPO: ${{ github.repository }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a version tag: $RELEASE_TAG"; exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName --jq .tagName

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - name: Versions match the tag
        run: |
          ref="$RELEASE_TAG"
          pkg=$(node -p "require('./package.json').version")
          plugin=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml)
          if [ "v$pkg" != "$ref" ]; then echo "::error::package.json version ($pkg) does not match tag $ref"; exit 1; fi
          if [ "v$plugin" != "$ref" ]; then echo "::error::herdr-plugin.toml version ($plugin) does not match tag $ref"; exit 1; fi

      # Publish the exact package attached by release.yml, never a second build.
      - name: Download the release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          for ((attempt=1; attempt<=120; attempt++)); do
            if gh release download "$RELEASE_TAG" --pattern "wherdr-${version}.tgz*" --dir package --clobber && (cd package && sha256sum -c "wherdr-${version}.tgz.sha256"); then break; fi
            sleep 15
          done
          cd package
          sha256sum -c "wherdr-${version}.tgz.sha256"

      - name: Publish
        run: npm publish "./package/wherdr-${RELEASE_TAG#v}.tgz" --provenance --access public
