# Docker image published on ghcr.io for each version tag (vX.Y.Z), or manually:
#   ghcr.io/<owner>/wherdr:<version>, :<major>.<minor> and :latest — linux/arm64 + linux/amd64.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build (e.g. v1.2.0); empty = current commit, tagged edge'
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Version
        id: v
        run: |
          ref="${{ inputs.version || github.ref_name }}"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            pkg=$(node -p "require('./package.json').version")
            if [ "v$pkg" != "$ref" ]; then
              echo "::error::package.json version ($pkg) does not match tag $ref"; exit 1
            fi
            plugin=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml)
            if [ "v$plugin" != "$ref" ]; then
              echo "::error::herdr-plugin.toml version ($plugin) does not match tag $ref"; exit 1
            fi
            echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.release }}
            type=raw,value=latest,enable=${{ steps.v.outputs.release }}
          labels: |
            org.opencontainers.image.title=wherdr
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml)" = "$version"
      - run: npm ci
      - run: npm pack
      - name: Attach package to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256sum "wherdr-${version}.tgz" > "wherdr-${version}.tgz.sha256"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "wherdr ${version}" --generate-notes
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" "wherdr-${version}.tgz" "wherdr-${version}.tgz.sha256" --clobber

  publish-release:
    needs: [image, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish without advancing the legacy update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

  homebrew:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip without HOMEBREW_TAP_TOKEN
        if: env.TAP_TOKEN == ''
        run: echo "::notice::Run scripts/bump-homebrew.sh ${GITHUB_REF_NAME#v} to update Homebrew."
      - name: Update formula from GitHub
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh auth setup-git
          scripts/bump-homebrew.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY_OWNER"
