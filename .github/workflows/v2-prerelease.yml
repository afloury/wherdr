# Rolling prerelease of the v2 branch: on every push to v2, the release
# v<version of herdr-plugin.toml> (e.g. v2.0.0-dev) is rebuilt for the pushed
# commit, so a machine installs v2 with the prebuilt package and never compiles.
#   - the tag moves to the pushed commit; the release is a prerelease, never latest
#     (1.x update checks only read stable vX.Y.Z releases);
#   - files: wherdr-<version>.tgz and .tgz.sha256 (made like release.yml: npm pack,
#     sha256sum) and COMMIT, the full SHA of the packaged commit, also in the notes.
# Only a version with a prerelease suffix is published (scripts/prerelease.sh):
# stable versions keep going through release.yml and its vX.Y.Z tags.
# The tag is moved with GITHUB_TOKEN, so it starts neither release.yml nor npm.yml.
name: v2 prerelease

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

# One at a time, never cancelled halfway through replacing the files.
concurrency:
  group: v2-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.ref == 'refs/heads/v2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version
        id: v
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable version: rolling prerelease is disabled."
            exit 0
          fi
          version="$(bash scripts/prerelease.sh version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - if: steps.v.outputs.version != ''
        run: npm ci

      - name: Package
        if: steps.v.outputs.version != ''
        run: |
          mkdir -p "$RUNNER_TEMP/prerelease"
          npm pack --pack-destination "$RUNNER_TEMP/prerelease"

      - name: Check the package
        if: steps.v.outputs.version != ''
        run: bash scripts/prerelease.sh package "$RUNNER_TEMP/prerelease/wherdr-${{ steps.v.outputs.version }}.tgz" "$GITHUB_SHA"

      - name: Publish the prerelease
        if: steps.v.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/prerelease.sh publish "$RUNNER_TEMP/prerelease/wherdr-${{ steps.v.outputs.version }}.tgz" "$GITHUB_SHA"
