# Checks: unit + component tests, type check, leak check (gitleaks only: the
# forbidden patterns file is local and never committed), then the end-to-end tests
# in Chromium and WebKit against a fake Herdr server.
#
# Two depths of browser tests (tests/e2e/scope.ts):
# - light (E2E_SCOPE=light), for pull requests and pushes to main or develop: every test
#   on chromium-phone in two shards, plus the tests tagged for chromium-desktop
#   (keyboard, split view), webkit-phone (Safari/iOS journeys) and webkit-desktop
#   (iPad, desktop Safari);
# - full, on a manual run or a release tag vX.Y.Z: every test on all four projects.
# The same five jobs run in both cases; only their selection changes.
#
# The branch protection requires the checks named `checks` and `e2e`: `e2e` is the
# last job, green only when every browser job is. After a failure, "Re-run failed
# jobs" runs the failed job again, then `e2e`.
name: ci

on:
  push:
    branches: [main, develop]
    # Release tags get the full suite.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main, develop]
  # Manual run: the full suite, on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group: a push never cancels a manual run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.28.0

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit and component tests
        run: npx vitest run

      - name: Type check
        run: npx nuxt typecheck

      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Leak check
        run: npm run check:leaks

  # Whether the browser tests are needed: not for a pull request that only
  # touches files with no effect on the app or on its tests. When in doubt, run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as its merge commit: the first
          # parent is the base branch.
          fetch-depth: 2

      - name: Look for a change that needs the browser tests
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          e2e=true
          if [ "$EVENT" = pull_request ] && files=$(git diff --no-renames --name-only HEAD^1 HEAD) && [ -n "$files" ]; then
            e2e=false
            while IFS= read -r file; do
              case "$file" in
                README.md | CHANGELOG.md | CONTRIBUTING.md | SECURITY.md | LICENSE) ;;
                docs/* | release-notes/* | website/*) ;;
                # The README launch film and the tooling that renders it.
                assets/* | tools/launch-video/*) ;;
                .github/workflows/npm.yml | .github/workflows/release.yml) ;;
                .github/workflows/release-ready.yml | .github/workflows/site.yml) ;;
                *) echo "needs the browser tests: $file"; e2e=true ;;
              esac
            done <<< "$files"
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  # Each job builds the app itself: the build takes 10-20 s, less than a separate
  # build job would add before the browser jobs (its own setup, upload, download).
  e2e-project:
    name: e2e-project (${{ matrix.project }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Full on a manual run or a release tag, light otherwise.
      E2E_SCOPE: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'full' || 'light' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-phone
            shard: 1/2
          - project: chromium-phone
            shard: 2/2
          - project: chromium-desktop
          - project: webkit-phone
          - project: webkit-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Playwright version and browser
        id: pw
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "browser=${PROJECT%%-*}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ steps.pw.outputs.browser }}

      - name: Use Ubuntu's public mirror for browser dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source" ]; then sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"; fi
          done

      - name: Install the browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ steps.pw.outputs.browser }}

      - name: Install the browser's system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ steps.pw.outputs.browser }}

      - name: Build and record duration
        run: |
          mkdir -p e2e-metrics
          /usr/bin/time -f '%e' -o e2e-metrics/build-seconds.txt npm run build

      # The timing reporter records startup/collection and test/teardown in ms;
      # the JSON report includes collected tests and their final skip status.
      - name: End-to-end tests
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "scope: $E2E_SCOPE, project: $PROJECT, shard: ${SHARD:-all}"
          npm run test:e2e -- --project="$PROJECT" ${SHARD:+--shard="$SHARD"}

      - name: Artifact name
        id: artifact
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "suffix=${SHARD:+-${SHARD%/*}}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}${{ steps.artifact.outputs.suffix }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            blob-report/
            e2e-metrics/
          retention-days: 7

  # The required check. `always()`: a skipped job would count as a success, so
  # this one runs whatever happened and reads the results itself. The matrix
  # result is `success` only when all five browser jobs passed: a failed,
  # cancelled or skipped one turns it red.
  e2e:
    needs: [changes, e2e-project]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser job to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.e2e }}
          PROJECTS: ${{ needs.e2e-project.result }}
        run: |
          echo "changes: $CHANGES, browser tests needed: $NEEDED, browser jobs: $PROJECTS"
          [ "$CHANGES" = success ] || exit 1
          case "$NEEDED" in
            false)
              [ "$PROJECTS" = skipped ] && echo "No change needs the browser tests." && exit 0
              exit 1 ;;
            true) [ "$PROJECTS" = success ] ;;
            *) echo "unexpected browser-test decision: '$NEEDED'"; exit 1 ;;
          esac
