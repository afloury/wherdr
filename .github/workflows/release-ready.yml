# npm moderation can outlive a workflow. Recheck without republishing anything.
name: release readiness
on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [npm, release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-readiness
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release-ready.mjs
        env:
          GH_TOKEN: ${{ github.token }}
