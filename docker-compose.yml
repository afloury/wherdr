# wherdr — PWA to drive, from your phone, the coding agents (Claude Code,
# Codex) running in Herdr (Nuxt 4 + Nuxt UI 4; Herdr gateway in Nitro).
#
# Installation-specific settings: `.env` file (not tracked by git), to create
# from `.env.example`. Custom icons: see docker-compose.override.example.yml.
#
# ⚠ This is a shell on the machine (launching/driving agents = running
# commands as the host user). Docker isolation is
# symbolic: the container talks to the Herdr socket running on the host.
# Hence: listens on 127.0.0.1 only, published on the tailnet only via
#   tailscale serve --bg --https=${PORT} http://127.0.0.1:${PORT}
# -> https://<host>.<tailnet>.ts.net:<port>, which wherdr then enables by itself
# (it reads what Tailscale publishes). Never a public route (Caddy, Cloudflare…).
services:
  herdr-web:
    # Image published on each release (arm64 + amd64). Update:
    #   docker compose pull && docker compose up -d
    # Build it yourself from source: see docker-compose.build.yml.
    image: ${WHERDR_IMAGE:-ghcr.io/afloury/wherdr:latest}
    container_name: wherdr
    hostname: ${HOST_LABEL:-wherdr}
    restart: always  # also restarts after a manual daemon stop or a reboot
    # Minimal init as PID 1: reaps detached processes (plugin commands).
    init: true
    environment:
      - PORT=${PORT:-7683}
      # Container user, created at startup: UID/GID and home directory
      # of the host (ssh reads ~/.ssh there; git, Herdr and files keep their owner).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HOME=${HOST_HOME:-${HOME}}
      - DATA_DIR=/data
      # Host Herdr binary (static musl, runs as is under alpine):
      # client and server stay on the same version after a `herdr update`.
      - HERDR_BIN=${HERDR_BIN:-${HOST_HOME:-${HOME}}/.local/bin/herdr}
      # Empty = Herdr's default session. `hwtest` for experiments.
      # Never HERDR_SESSION: Herdr reads that variable itself.
      - HERDR_WEB_SESSION=${HERDR_WEB_SESSION:-}
      - AGENT_KINDS=${AGENT_KINDS:-pi,claude,codex,gemini,cursor,devin,agy,cline,omp,mastracode,opencode,copilot,kimi,kiro,droid,amp,grok,hermes,kilo,qodercli,qwen,letta,maki,muse}
      # Herdr SSH machines (`herdr machine list`): `off` to stick to this one.
      - HERDR_WEB_MACHINES=${HERDR_WEB_MACHINES:-on}
      - HERDR_WEB_SELF_HOSTS=${HERDR_WEB_SELF_HOSTS:-}
      - APP_URL=${APP_URL:-}
      - HERDR_WEB_ALLOWED_HOSTS=${HERDR_WEB_ALLOWED_HOSTS:-}
      - HOST_LABEL=${HOST_LABEL:-}
      - PASSKEY_USER=${PASSKEY_USER:-wherdr}
      - TZ=${TZ:-UTC}
      # "New version" notice (one request per day to the GitHub releases API): `off` to disable it.
      - WHERDR_UPDATE_CHECK=${WHERDR_UPDATE_CHECK:-on}
    # Short tailnet names (`ssh laptop`): musl only tries the search domain
    # (MagicDNS) if the name has fewer than `ndots` dots; Docker sets 0.
    dns_opt:
      - ndots:1
    ports:
      - "127.0.0.1:${PORT:-7683}:${PORT:-7683}"
    volumes:
      # VAPID keys, push subscriptions, passkeys, recent folders.
      - ./data:/data
      # $HOME read-only: folder picker, transcripts, herdr binary,
      # at the same path as on the host (the cwds Herdr returns are host paths).
      - ${HOST_HOME:-${HOME}}:${HOST_HOME:-${HOME}}:ro
      # …except the Herdr config, writable: API and client sockets.
      - ${HOST_HOME:-${HOME}}/.config/herdr:${HOST_HOME:-${HOME}}/.config/herdr
      # The SSH profile catalog must be writable for "Rename machine".
      - ${HOST_HOME:-${HOME}}/.local/state/herdr/client:${HOST_HOME:-${HOME}}/.local/state/herdr/client
      # …and the store of photos sent from the phone (purged after 7 days),
      # which agents read by their path.
      - ${HOST_HOME:-${HOME}}/.cache/herdr-web:${HOST_HOME:-${HOME}}/.cache/herdr-web
      # herdr-projects projects (New project, adopt, open, pause/resume from
      # the app): their root folder, writable. Other root (`root` in
      # ~/.config/herdr-projects/config.toml): mount that one instead.
      - ${HOST_HOME:-${HOME}}/.herdr-projects:${HOST_HOME:-${HOME}}/.herdr-projects
      # Tailscale's socket, read-only: the container has no `tailscale` command,
      # so wherdr reads there which address `tailscale serve` publishes for its
      # port and enables it by itself (and refuses it again once removed).
      # Reading needs no rights; wherdr changes nothing through it. Without
      # Tailscale on the host, Docker creates this folder empty: harmless.
      # After Tailscale itself restarts (an update), restart this container.
      - /var/run/tailscale:/var/run/tailscale:ro
