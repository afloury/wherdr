server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # `curl -fsSL https://wherdr.dev/install | sh`: a plain-text shell script.
  location = /install {
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /install =404;
  }

  # Plain-text guides for coding agents and LLMs.
  location = /agent.md {
    types { }
    default_type text/markdown;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /agent.md =404;
  }
  location = /llms.txt {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /llms.txt =404;
  }

  # Header rules for Cloudflare Workers (wrangler.jsonc), mirrored by this file.
  location = /_headers {
    return 404;
  }

  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/index.html $uri.html /index.html;
  }
}
