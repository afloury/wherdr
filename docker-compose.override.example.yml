# Icônes personnelles, sans toucher au code : copier ce fichier en
# `docker-compose.override.yml` (non suivi par git, lu automatiquement par
# `docker compose`) et déposer ses icônes dans `branding/` (non suivi), avec la
# même arborescence que server/assets/branding :
#   branding/icons/  apple-touch-icon.png (180), favicon-32.png, icon-192.png,
#                    icon-512.png, icon-512-maskable.png
#   branding/favicon.ico
# Le serveur les sert à la place de celles du dépôt (une icône absente retombe
# sur celle du dépôt). Après un changement d'icônes : `docker compose up -d`.
services:
  herdr-web:
    environment:
      - BRANDING_DIR=/branding
    volumes:
      - ./branding:/branding:ro
