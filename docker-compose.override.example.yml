# Custom icons, without touching the code: copy this file to
# `docker-compose.override.yml` (not tracked by git, read automatically by
# `docker compose`) and put your icons in `branding/` (not tracked), with the
# same layout as server/assets/branding:
#   branding/icons/  apple-touch-icon.png (180), favicon-32.png, icon-192.png,
#                    icon-512.png, icon-512-maskable.png
#   branding/favicon.ico
# The server serves them instead of the repository's (a missing icon falls back
# to the repository's). After changing icons: `docker compose up -d`.
services:
  herdr-web:
    environment:
      - BRANDING_DIR=/branding
    volumes:
      - ./branding:/branding:ro
