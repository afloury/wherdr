# Build the image from source (development, local changes)
# instead of pulling the one published on ghcr.io:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Update: git pull, then the same command. (With a docker-compose.override.yml,
# add it too: -f docker-compose.override.yml.)
services:
  herdr-web:
    build:
      context: .
    image: wherdr:local
    pull_policy: build
    environment:
      # Update command offered in the app.
      - WHERDR_INSTALL=docker-build
