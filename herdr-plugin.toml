id = "afloury.wherdr"
name = "wherdr"
version = "1.2.0"
min_herdr_version = "0.9.1"
description = "Your Herdr agents from your phone and browser: live conversations, real terminals, push notifications and one-tap answers. Self-hosted, private network only."
platforms = ["linux", "macos"]

# Docker on Linux when usable, otherwise Node.js 22 (always on macOS).
# Writes only to this folder and ~/wherdr (WHERDR_DIR); starts nothing.
[[build]]
command = ["sh", "scripts/herdr-plugin.sh", "build"]

# One-shot on each Herdr start: starts wherdr detached, unless something
# already answers on its port (a wherdr started another way is left alone).
[[startup]]
command = ["sh", "scripts/herdr-plugin.sh", "start"]

# Every action but Open shows its readable output in a popup (the [[panes]]
# below), never the raw JSON of `herdr plugin action invoke`.

[[actions]]
id = "start"
title = "Start wherdr"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint start --focus"]

[[actions]]
id = "stop"
title = "Stop wherdr"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint stop --focus"]

[[actions]]
id = "restart"
title = "Restart wherdr"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint restart --focus"]

[[actions]]
id = "status"
title = "wherdr status"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint status --focus"]

[[actions]]
id = "open"
title = "Open wherdr in the browser"
contexts = ["global", "workspace"]
command = ["sh", "scripts/herdr-plugin.sh", "open"]

[[actions]]
id = "logs"
title = "wherdr logs"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint logs --focus"]

[[actions]]
id = "doctor"
title = "wherdr doctor"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint doctor --focus"]

[[actions]]
id = "update"
title = "Update wherdr"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint update --focus"]

[[actions]]
id = "phone"
title = "wherdr: phone setup"
contexts = ["global", "workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint phone --focus"]

[[panes]]
id = "start"
title = "Start wherdr"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "scripts/herdr-plugin.sh", "pane", "start"]

[[panes]]
id = "stop"
title = "Stop wherdr"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "scripts/herdr-plugin.sh", "pane", "stop"]

[[panes]]
id = "restart"
title = "Restart wherdr"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "scripts/herdr-plugin.sh", "pane", "restart"]

[[panes]]
id = "status"
