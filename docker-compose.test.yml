# Instance de test : 127.0.0.1:7684, session Herdr isolée `hwtest`, données de
# test (copie de data/ sans les abonnements push). Ne touche jamais la prod.
# Lit le même `.env` (HOST_HOME…) ; le docker-compose.override.yml n'est pas appliqué.
#   herdr --session hwtest server   (dans un autre terminal, variables HERDR_* retirées)
#   cp -a data test-data && echo '{ "subs": [] }' > test-data/push.json
#   docker compose -f docker-compose.test.yml up -d --build
services:
  herdr-web-test:
    build:
      context: .
      # Dossier personnel de l'utilisateur du conteneur (ssh y lit ~/.ssh).
      args:
        HOST_HOME: ${HOST_HOME:-${HOME}}
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: herdr-web:test
    container_name: ${TEST_CONTAINER:-herdr-web-test}
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - PORT=7684
      - HOME=${HOST_HOME:-${HOME}}
      - DATA_DIR=/data
      - HERDR_BIN=${HERDR_BIN:-${HOST_HOME:-${HOME}}/.local/bin/herdr}
      - HERDR_WEB_SESSION=hwtest
      # Machines distantes : session `hwtest` aussi (jamais celle du profil, `default`).
      - HERDR_WEB_REMOTE_SESSION=${HERDR_WEB_REMOTE_SESSION:-hwtest}
      - HERDR_WEB_MACHINES=${HERDR_WEB_MACHINES:-on}
      - HERDR_WEB_SELF_HOSTS=${HERDR_WEB_SELF_HOSTS:-}
      - AGENT_KINDS=${AGENT_KINDS:-pi,claude,codex,gemini,cursor,devin,agy,cline,omp,mastracode,opencode,copilot,kimi,kiro,droid,amp,grok,hermes,kilo,qodercli,qwen,letta,maki,muse}
      - APP_URL=${APP_URL:-}
      - HERDR_WEB_ALLOWED_HOSTS=${HERDR_WEB_ALLOWED_HOSTS:-}
      - HOST_LABEL=${HOST_LABEL:-}
      - PASSKEY_USER=${PASSKEY_USER:-wherdr}
      - TZ=${TZ:-UTC}
    # Noms courts du tailnet (`ssh laptop`) : musl ne tente le domaine de
    # recherche (MagicDNS) que si le nom a moins de `ndots` points ; Docker met 0.
    dns_opt:
      - ndots:1
    ports:
      - "127.0.0.1:7684:7684"
    volumes:
      - ./test-data:/data
      - ${HOST_HOME:-${HOME}}:${HOST_HOME:-${HOME}}:ro
      - ${HOST_HOME:-${HOME}}/.config/herdr:${HOST_HOME:-${HOME}}/.config/herdr
      - ${HOST_HOME:-${HOME}}/.cache/herdr-web:${HOST_HOME:-${HOME}}/.cache/herdr-web
